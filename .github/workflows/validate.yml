name: Validate HANDS tool modules
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate tool manifests and command dependencies
        run: node scripts/validate.mjs
      - name: Check registry hashes
        run: |
          node scripts/build-registry.mjs
          git diff --exit-code -- registry.json
